ervices:
  oracle_db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle_db_aegis
    restart: unless-stopped
    shm_size: 1g
    environment:
      ORACLE_PASSWORD: FiapPassword123
      APP_USER: aegis_user
      APP_USER_PASSWORD: FiapPassword123
    ports:
      - "1521:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - aegis_network

  api_aegis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_aegis_aegis
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__OracleConnection=Data Source=oracle_db_aegis:1521/FREEPDB1;User Id=aegis_user;Password=FiapPassword123;
      - ASPNETCORE_ENVIRONMENT=Development
      -  networks:
      - aegis_network
    depends_on:
      - oracle_db

volumes:
  oracle_data:

networks:
  aegis_network:
